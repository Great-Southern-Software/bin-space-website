site.url=https://www.bin-space.app

# Google Analytics 4 - property "bin-space-prod" (534145963), stream "Bin Space website".
# Off for dev and test so local browsing is never counted as real traffic. A blank id
# would not do as the off switch: Quarkus reads an empty value as no value at all, and
# the template then fails on the missing key instead of quietly skipping the tag.
binspace.analytics.enabled=true
binspace.analytics.ga-id=G-169VSVSW1L
%dev.binspace.analytics.enabled=false
%test.binspace.analytics.enabled=false
